# Emerald build pipeline (go-task, taskfile.dev).
#
#   task            build bin/emeraldc (default)
#   task test       run the complete golden, runtime, shape, warning, report, and CLI suite
#   task examples   compile & run the smoke examples
#   task clean      remove build outputs and generated C

version: '3'

vars:
  CC: '{{default "cc" .CC}}'
  CFLAGS: -std=c11 -Wall -Wextra -O2 -g -Iinclude
  VERSION: 1.0.0
  SRCDIR:
    sh: echo "$PWD/src"
  STDLIBDIR:
    sh: echo "$PWD/stdlib"
  COMPILER_SRCS: src/lexer.c src/ast.c src/parser_util.c src/parser_expr.c src/parser_stmt.c src/module_resolve.c src/module_rename.c src/module_load.c src/check_type.c src/check_ctx.c src/check_infer.c src/check_call.c src/check_expr.c src/check_flow.c src/check_stmt.c src/check_pass.c src/codegen_ctx.c src/codegen_expr.c src/codegen_stmt.c src/codegen_close.c src/codegen_prog.c src/diag.c src/dim.c src/repl.c src/main.c

tasks:
  default:
    deps: [build]

  build:
    desc: Build the Emerald compiler (bin/emeraldc)
    sources:
      - src/*.c
      - include/*.h
    generates:
      - bin/emeraldc
    cmds:
      - mkdir -p bin
      - >-
        {{.CC}} {{.CFLAGS}} -DEMERALD_VERSION='"{{.VERSION}}"'
        -DEMERALD_SRC_DIR='"{{.SRCDIR}}"'
        -DEMERALD_STDLIB_DIR='"{{.STDLIBDIR}}"'
        -o bin/emeraldc {{.COMPILER_SRCS}}

  runtime-check:
    desc: Prove the runtime compiles standalone under strict flags
    cmds:
      - '{{.CC}} {{.CFLAGS}} -fsyntax-only -Iinclude -Isrc src/runtime_gc.c src/runtime_obj.c src/runtime_ops.c src/runtime_builtins.c src/runtime_task.c src/runtime_tensor.c'

  test:
    desc: Run all stage test suites, including CLI, shape, warning, and proof-report checks
    deps: [build]
    cmds:
      - task: runtime-check
      - ./tests/run_tests.sh

  test:lexer:
    desc: Golden tests for the lexer (--emit-tokens)
    deps: [build]
    cmds:
      - ./tests/run_tests.sh lexer

  test:parser:
    desc: Golden tests for the parser (--emit-ast)
    deps: [build]
    cmds:
      - ./tests/run_tests.sh parser

  test:check:
    desc: Golden tests for the type checker (--check)
    deps: [build]
    cmds:
      - ./tests/run_tests.sh check

  test:proof:
    desc: Golden tests for proof mode (--check --proof)
    deps: [build]
    cmds:
      - ./tests/run_tests.sh proof

  test:e2e:
    desc: Compile-and-run golden tests (full pipeline through cc)
    deps: [build]
    cmds:
      - ./tests/run_tests.sh e2e

  test:imports:
    desc: Golden tests for the module system (resolution, linking, errors)
    deps: [build]
    cmds:
      - ./tests/run_tests.sh imports

  test:repl:
    desc: Golden tests for the interactive session (--repl)
    deps: [build]
    cmds:
      - ./tests/run_tests.sh repl

  test:cli:
    desc: Smoke tests for stable command-line help, version, and option errors
    deps: [build]
    cmds:
      - ./tests/run_tests.sh cli

  test:stdlib:
    desc: Golden tests for the standard library (stdlib/*.rald)
    deps: [build]
    cmds:
      - ./tests/run_tests.sh stdlib

  test:shape:
    desc: Unit tests for the dim-expression solver (tests/shape/dim_unit.c)
    deps: [build]
    cmds:
      - ./tests/run_tests.sh shape

  examples:
    desc: Compile and run every example program
    deps: [build]
    cmds:
      - |
        for f in examples/*.rald; do
          echo "== $f"
          # stdin is closed: examples that read the console (console.rald) then
          # take their EOF branch instead of waiting for a terminal.
          ./bin/emeraldc "$f" && "${f%.rald}" < /dev/null
        done
      - |
        for f in examples/*/main.rald; do
          echo "== $f"
          ./bin/emeraldc -o "${f%.rald}" "$f" && "${f%.rald}" < /dev/null
        done

  bless:
    desc: Regenerate all golden .expected files (review the diff before committing!)
    deps: [build]
    cmds:
      - for f in tests/lexer/*.rald; do ./bin/emeraldc --emit-tokens "$f" > "${f%.rald}.expected"; done
      - for f in tests/parser/*.rald; do ./bin/emeraldc --emit-ast "$f" > "${f%.rald}.expected"; done
      - for f in tests/check/*.rald; do ./bin/emeraldc --check "$f" > "${f%.rald}.expected" 2>&1 || true; done
      - for f in tests/check/*.rald; do ./bin/emeraldc --check --json "$f" > "${f%.rald}.json.expected" 2>&1 || true; done
      - for f in tests/proof/*.rald; do ./bin/emeraldc --check --proof "$f" > "${f%.rald}.expected" 2>&1 || true; done
      - |
        for f in tests/e2e/*.rald; do
          ./bin/emeraldc -o "${f%.rald}" "$f" && "${f%.rald}" > "${f%.rald}.expected" 2>&1 || true
          rm -f "${f%.rald}"
        done
      - |
        for d in tests/imports/*/; do
          d="${d%/}"
          [ -f "$d/main.rald" ] || continue
          flags=""; [ -f "$d/flags" ] && flags="$(cat "$d/flags")"
          case "$(basename "$d")" in
          bad_*)
            ./bin/emeraldc --check $flags "$d/main.rald" > "$d/expected" 2>&1 || true ;;
          *)
            ./bin/emeraldc $flags -o "$d/main.bin" "$d/main.rald" &&
              "$d/main.bin" > "$d/expected" 2>&1
            rm -f "$d/main.bin" ;;
          esac
        done

      - |
        for f in tests/repl/*.in; do
          ./bin/emeraldc --repl < "$f" 2>&1 |
            sed 's#/tmp/emerald-repl-[0-9]*#<repl>#g' > "${f%.in}.expected"
        done
      - |
        for f in tests/stdlib/*.rald; do
          stdin="${f%.rald}.stdin"; [ -f "$stdin" ] || stdin=/dev/null
          ./bin/emeraldc -o "${f%.rald}.bin" "$f" &&
            "${f%.rald}.bin" < "$stdin" > "${f%.rald}.expected" 2>&1 || true
          rm -f "${f%.rald}.bin"
        done

  install:
    desc: Install emeraldc and the stdlib under PREFIX (default /usr/local)
    deps: [build]
    vars:
      PREFIX: '{{default "/usr/local" .PREFIX}}'
    cmds:
      - mkdir -p "{{.PREFIX}}/bin" "{{.PREFIX}}/lib/emerald/stdlib"
      - install -m 0755 bin/emeraldc "{{.PREFIX}}/bin/emeraldc"
      - install -m 0644 stdlib/*.rald "{{.PREFIX}}/lib/emerald/stdlib/"

  dist:
    desc: Build a release tarball (smoke-test it outside the checkout before release)
    deps: [build]
    cmds:
      - rm -rf dist emerald-{{.VERSION}}.tar.gz
      - mkdir -p dist/emerald/bin dist/emerald/lib/emerald/stdlib
      - cp bin/emeraldc dist/emerald/bin/emeraldc
      - cp stdlib/*.rald dist/emerald/lib/emerald/stdlib/
      - cp README.md CHANGELOG.md dist/emerald/ 2>/dev/null || cp README.md dist/emerald/
      - tar -C dist -czf emerald-{{.VERSION}}.tar.gz emerald
      - rm -rf dist

  clean:
    desc: Remove build outputs and generated C
    cmds:
      - rm -rf bin dist
      - rm -f emerald-*.tar.gz
      - rm -f examples/*.gen.c tests/e2e/*.gen.c tests/imports/*/main.bin*
      - rm -f tests/stdlib/*.bin tests/stdlib/*.gen.c
      - for f in examples/*.rald tests/e2e/*.rald examples/*/main.rald examples/ray_tracer/typed/main.rald; do rm -f "${f%.rald}"; done
      - rm -f examples/ray_tracer/out.ppm examples/.DS_Store
